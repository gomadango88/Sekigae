<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- artifact:head:start -->
<title>席替えシステム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* 教室を上から見た図：上端に黒板、その下に座席グリッドを一画面に収める */
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --ink: #1c2925;
    --muted: #5e6f69;
    --line: #c9d4cf;
    --board: #2e5a4c;
    --board-ink: #f2f5ef;
    --accent: #2e5a4c;
    --accent-ink: #ffffff;
    --error: #b4483c;
    --font: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111715; --surface: #1a2320; --ink: #e6eeea; --muted: #94a6a0; --line: #33433d;
      --board: #24463b; --board-ink: #e8efe6; --accent: #8cc4ae; --accent-ink: #0f1a16; --error: #e58a7e;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111715; --surface: #1a2320; --ink: #e6eeea; --muted: #94a6a0; --line: #33433d;
    --board: #24463b; --board-ink: #e8efe6; --accent: #8cc4ae; --accent-ink: #0f1a16; --error: #e58a7e;
    color-scheme: dark;
  }

  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
  }
  .app {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-inline: 16px;
    padding-block: 10px 14px;
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
  }
  .bar h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  .status { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; flex: 1; min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit;
    font-size: 0.9rem;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    padding-inline: 20px;
  }
  .note { color: var(--muted); font-size: 0.8rem; }

  /* 座席エリア。高さいっぱいに広げ、横幅は高さに合わせて上限をかける */
  .stage {
    flex: 1;
    min-height: 0;
    container-type: size;
    display: grid;
    place-items: center;
  }
  .room {
    width: min(100cqw, 125cqh);
    height: 100cqh;
    display: flex;
    flex-direction: column;
    gap: 1.2cqh;
  }
  .board {
    background: var(--board);
    color: var(--board-ink);
    text-align: center;
    border-radius: 4px;
    font-size: clamp(0.75rem, 2.6cqh, 1.4rem);
    padding-block: 0.6cqh;
    letter-spacing: 0.4em;
  }
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 0.8cqh;
  }
  .seat {
    container-type: size;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    overflow: hidden;
  }
  .seat.none { background: transparent; border-color: transparent; }
  .seat .no {
    font-weight: 700;
    font-size: min(58cqh, 40cqw);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .seat.empty .no { color: var(--muted); font-weight: 400; }
  .before .seat .no { color: var(--muted); }

  .error {
    border: 1px solid var(--error);
    color: var(--error);
    background: var(--surface);
    padding: 12px 16px;
    border-radius: 6px;
    white-space: pre-line;
  }

  /* ダイアログ */
  dialog {
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
    padding: 0;
    width: min(560px, calc(100vw - 32px));
    max-height: calc(100vh - 32px);
    box-sizing: border-box;
  }
  dialog::backdrop { background: rgb(0 0 0 / 0.45); }
  .dlg { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
  .dlg h2 { margin: 0; font-size: 1.1rem; }
  .hint { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.6; }
  .hint.warn { color: var(--error); }
  .dlg-actions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .spacer { flex: 1; }

  .picker {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 6px;
  }
  .picker label { position: relative; }
  .picker input {
    position: absolute;
    opacity: 0;
    inset: 0;
    margin: 0;
    cursor: pointer;
  }
  .picker span {
    display: block;
    text-align: center;
    padding-block: 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-variant-numeric: tabular-nums;
    font-weight: 700;
    user-select: none;
  }
  .picker input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .picker input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }

  .names { display: flex; flex-direction: column; gap: 8px; padding: 12px; border: 1px solid var(--line); border-radius: 6px; }
  .names > div { display: flex; flex-direction: column; gap: 8px; }
  .names .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .names #pw {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    flex: 1;
    min-width: 0;
  }
  .names label { font-size: 0.9rem; }
  .names a { color: var(--accent); }
  .err { margin: 0; color: var(--error); font-size: 0.85rem; }
  .dlg h3 { margin: 0 0 8px; font-size: 0.95rem; }
  .share-grid { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 520px) { .share-grid { grid-template-columns: minmax(0, 1fr); } }
  .qr { background: #fff; padding: 6px; border-radius: 6px; border: 1px solid var(--line); width: 156px; }
  .qr svg { display: block; width: 100%; height: auto; }
  .share-codes { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .share-code { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .share-code .row { display: flex; gap: 8px; align-items: center; }
  .share-label { font-size: 0.85rem; font-weight: 700; }
  .share-code code {
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 0.95rem;
    letter-spacing: 0.04em;
    word-break: break-word;
    flex: 1;
    min-width: 0;
  }
  .share-receive { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
  .share-receive .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .file-button {
    position: relative;
    font-size: 0.9rem;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    cursor: pointer;
  }
  .file-button:hover { border-color: var(--muted); }
  .file-button:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  .file-button input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .scanner { display: flex; flex-direction: column; gap: 6px; }
  .scanner video { width: 100%; max-height: 38vh; background: #000; border-radius: 6px; object-fit: cover; }
  #import-code {
    font: inherit;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
    flex: 1;
    min-width: 0;
  }
  .for-password-manager { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .field { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 0.9rem; }
  .field input[type="date"]:disabled { opacity: 0.45; }
  .field input[type="date"] {
    font: inherit;
    padding: 4px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
  }

  /* 印刷用の座席表（A4横）。画面には出さない */
  .sheet { display: none; }

  @media print {
    @page { size: A4 landscape; margin: 10mm; }
    :root { color-scheme: light; }
    html, body { height: auto; background: #fff; color: #000; }
    .app, dialog { display: none !important; }
    /* 印刷できる幅いっぱいに広げ、高さは幅に比例させる。
       中身の大きさも幅（cqw）基準にして、用紙・余白・倍率が変わっても1枚に収まるようにする */
    .sheet {
      display: block;
      width: 100%;
      aspect-ratio: 277 / 172;
      container-type: inline-size;
      overflow: hidden;
      break-inside: avoid;
      color: #000;
    }
    .sheet-inner { height: 100%; display: flex; flex-direction: column; gap: 1.1cqw; }
    .sheet-title { margin: 0; text-align: center; font-size: 2.2cqw; font-weight: 700; line-height: 1.2; }
    .sheet-head { display: grid; grid-template-columns: 1fr 26cqw 1fr; align-items: end; gap: 1.4cqw; font-size: 1.5cqw; }
    .sheet-count { text-align: right; }
    .sheet-desk {
      border: max(1px, 0.1cqw) solid #000;
      text-align: center;
      font-size: 1.65cqw;
      padding-block: 0.35cqw;
      letter-spacing: 1.5em;
      text-indent: 1.5em;
    }
    .sheet-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      column-gap: 3.2cqw;
      row-gap: 1cqw;
    }
    .sheet-cell { display: grid; grid-template-columns: 2.2cqw minmax(0, 1fr); min-height: 0; }
    .sheet-no { font-size: 1.15cqw; line-height: 1; text-align: right; padding-right: 0.35cqw; font-variant-numeric: tabular-nums; }
    .sheet-box {
      border: max(1px, 0.1cqw) solid #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 0;
      overflow: hidden;
    }
    /* ふりがなは名前の上に小さく、名前は四角の中ほどに大きく */
    .sheet-box { gap: 0.3cqw; }
    .sheet-kana { font-size: 1.1cqw; line-height: 1.2; white-space: nowrap; }
    .sheet-name { font-size: 1.9cqw; line-height: 1.2; white-space: nowrap; }
  }
</style>
<!-- artifact:head:end -->
</head>
<body>
<!-- artifact:body:start -->
<div class="app">
  <header class="bar">
    <h1>席替え</h1>
    <div class="status" id="status"></div>
    <div class="actions">
      <button type="button" class="primary" id="shuffle">席替えする</button>
      <button type="button" id="undo" disabled>1つ前に戻す</button>
      <button type="button" id="flip" aria-pressed="false">教卓から見る</button>
      <button type="button" id="open-front">前希望</button>
      <button type="button" id="open-output">座席表を出力</button>
      <button type="button" id="open-share">共有</button>
    </div>
  </header>
  <div class="note" id="note" hidden></div>
  <main class="stage" id="stage"></main>
</div>
<div class="sheet" id="sheet"></div>

<dialog id="front-dialog" aria-labelledby="front-title">
  <form method="dialog" class="dlg">
    <h2 id="front-title">前希望</h2>
    <p class="hint" id="front-hint"></p>
    <div class="picker" id="front-picker"></div>
    <p class="hint" id="front-count"></p>
    <div class="dlg-actions">
      <button type="button" id="front-clear">すべて外す</button>
      <button type="button" id="front-reset">設定ファイルの状態に戻す</button>
      <span class="spacer"></span>
      <button class="primary" value="close">閉じる</button>
    </div>
  </form>
</dialog>

<dialog id="output-dialog" aria-labelledby="output-title">
  <form method="dialog" class="dlg">
    <h2 id="output-title">座席表を出力</h2>
    <div class="names">
      <div id="names-none" hidden>
        <p class="hint">名前の一覧はまだ登録されていません。番号だけで出力します。<br>
          <a href="names.html" target="_blank" rel="noopener">名前の一覧を登録する</a></p>
      </div>
      <div id="names-locked" hidden>
        <label for="pw">名前を入れるには、パスワードを入力してください</label>
        <input type="text" class="for-password-manager" id="pm-user" autocomplete="username" value="座席表の名前一覧" readonly tabindex="-1" aria-hidden="true">
        <div class="row">
          <input type="password" id="pw" autocomplete="current-password">
          <button type="button" id="unlock">名前を読み込む</button>
        </div>
        <div class="row">
          <label><input type="checkbox" id="show-pw"> パスワードを表示</label>
          <label><input type="checkbox" id="remember" checked> この端末でパスワードを覚える</label>
        </div>
        <p class="err" id="pw-error" hidden></p>
        <p class="hint" id="names-created" hidden></p>
        <p class="hint">パスワードがわからないときは、<a href="names.html" target="_blank" rel="noopener">名前の一覧を作り直して</a>新しいパスワードを決められます。</p>
      </div>
      <div id="names-unlocked" hidden>
        <div class="row">
          <label><input type="checkbox" id="with-names" checked> 名前を入れる</label>
          <span class="spacer"></span>
          <button type="button" id="forget">この端末の記憶を消す</button>
        </div>
      </div>
    </div>
    <div class="field">
      <label><input type="checkbox" id="with-date" checked> 日付を入れる</label>
      <input type="date" id="start-date" aria-label="座席表の日付">
      <span class="hint">「○月○日～」として入ります</span>
    </div>
    <p class="hint">印刷画面では、用紙を A4・横向きにしてください。</p>
    <div class="dlg-actions">
      <button type="button" id="pdf">PDF・印刷</button>
      <button type="button" id="xlsx">Excelで保存</button>
      <button type="button" id="copy">表をコピー</button>
      <span class="spacer"></span>
      <button value="close">閉じる</button>
    </div>
    <p class="hint" id="output-note" hidden></p>
  </form>
</dialog>
<dialog id="share-dialog" aria-labelledby="share-title">
  <form method="dialog" class="dlg">
    <h2 id="share-title">座席の共有</h2>
    <div class="share-send" id="share-send">
      <h3>この座席を別の端末で開く</h3>
      <div class="share-grid">
        <div class="qr" id="share-qr" role="img" aria-label="完全再現コードの QR コード"></div>
        <div class="share-codes">
          <div class="share-code">
            <span class="share-label">完全再現コード</span>
            <div class="row"><code id="full-code"></code><button type="button" id="copy-full">コピー</button></div>
            <p class="hint">QR コードを読み取るか、このコードを入力すると、どの端末でもこの座席がそのまま開きます。</p>
          </div>
          <div class="share-code">
            <span class="share-label">シード</span>
            <div class="row"><code id="seed-code"></code><button type="button" id="copy-seed">コピー</button></div>
            <p class="hint" id="seed-hint"></p>
          </div>
        </div>
      </div>
    </div>
    <div class="share-receive">
      <h3>受け取ったコードで座席を再現する</h3>
      <label for="import-code" class="hint">シード（10桁）か完全再現コード（45桁）。区切りの空白はあってもなくてもかまいません。</label>
      <div class="row">
        <input type="text" id="import-code" autocomplete="off" spellcheck="false">
        <button type="button" id="import">再現する</button>
      </div>
      <div class="row">
        <button type="button" id="scan-camera">カメラで QR を読み取る</button>
        <label class="file-button">画像から QR を読み取る<input type="file" id="scan-image" accept="image/*"></label>
      </div>
      <div class="scanner" id="scanner" hidden>
        <video id="scan-video" playsinline muted></video>
        <div class="row">
          <span class="hint">QR コードをカメラに向けてください。</span>
          <span class="spacer"></span>
          <button type="button" id="scan-stop">やめる</button>
        </div>
      </div>
      <p class="err" id="import-error" hidden></p>
    </div>
    <div class="dlg-actions">
      <span class="hint" id="share-note"></span>
      <span class="spacer"></span>
      <button value="close">閉じる</button>
    </div>
  </form>
</dialog>

<script src="config.js"></script>
<script src="names.js"></script>
<script src="seating.js"></script>
<script src="secret.js"></script>
<script src="xlsx.js"></script>
<script src="share.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="vendor/jsQR.js"></script>

<script>
(function () {
  "use strict";
  const config = window.SEKIGAE_CONFIG;
  let encryptedNames = window.SEKIGAE_NAMES;
  const { seats, rows, cols } = Seating.parseLayout(config.layout);
  const allNos = config.students.map((s) => s.no).sort((a, b) => a - b);
  const frontRows = config.frontRows ?? 3;
  const frontCapacity = seats.filter((s) => s.row < frontRows).length;

  const STORAGE_KEY = "sekigae:v1";
  const VIEW_KEY = "sekigae:view";
  const FRONT_KEY = "sekigae:front";
  const NAMEKEY_KEY = "sekigae:namekey";
  const DATE_KEY = "sekigae:withDate";
  const signature = JSON.stringify([config.layout, allNos]);

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");

  const storage = {
    get(key) { try { return JSON.parse(localStorage.getItem(key) || "null"); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* 保存できない環境ではそのまま */ } },
    remove(key) { try { localStorage.removeItem(key); } catch (e) { /* 同上 */ } },
  };

  // 現在の配置と、戻すための履歴
  let current = null; // { seats: [番号|null...], at: ISO文字列 }
  let history = [];
  // true のとき教卓側から見た向き（上下左右を反転し、黒板を下に置く）
  let fromTeacher = false;
  // 前希望の番号（画面で変えたものがあればそちらを使う）
  const configFront = () => new Set(config.students.filter((s) => s.front).map((s) => s.no));
  let front = configFront();
  // 復号した名前 { "出席番号": "名前" }。画面には出さず、出力のときだけ使う
  let names = null;

  function load() {
    const saved = storage.get(STORAGE_KEY);
    if (saved && saved.signature === signature) {
      current = saved.current;
      history = saved.history || [];
    }
    fromTeacher = storage.get(VIEW_KEY) === "teacher";
    const savedFront = storage.get(FRONT_KEY);
    if (Array.isArray(savedFront)) front = new Set(savedFront.filter((no) => allNos.includes(no)));
  }
  function save() {
    storage.set(STORAGE_KEY, { signature, current, history });
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  function fileDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  // 席替え前は出席番号順に並べて表示する
  function orderedSeats() {
    return seats.map((_, i) => (i < allNos.length ? allNos[i] : null));
  }

  // 表示する向きのマス目。生徒から見た向きなら1行目が黒板側。座席でないマスは undefined
  function toMatrix(assignment) {
    const m = Array.from({ length: rows }, () => Array(cols).fill(undefined));
    seats.forEach((seat, i) => { m[seat.row][seat.col] = assignment[i]; });
    return fromTeacher ? m.reverse().map((line) => line.reverse()) : m;
  }

  // 出力に名前を入れるか
  const useNames = () => !!names && $("with-names").checked;
  // 1人分の名前。名前の一覧の値は「名前」の文字列か { name, kana }
  function entryOf(no) {
    const e = useNames() ? names[no] : null;
    if (!e) return { name: "", kana: "" };
    const tidy = (v) => (v || "").trim().replace(/[\s\u3000]+/g, "\u3000"); // 姓と名の間は全角スペース
    return typeof e === "string" ? { name: tidy(e), kana: "" } : { name: tidy(e.name), kana: tidy(e.kana) };
  }
  const nameOf = (no) => entryOf(no).name;

  // 画面には番号だけを出す（名前は出力のときだけ使う）
  function render() {
    const assignment = current ? current.seats : orderedSeats();
    const matrix = toMatrix(assignment);

    const room = document.createElement("div");
    room.className = "room" + (current ? "" : " before");
    const board = document.createElement("div");
    board.className = "board";
    board.textContent = "黒板";

    const grid = document.createElement("div");
    grid.className = "grid";
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
    matrix.forEach((line) => line.forEach((no) => {
      const cell = document.createElement("div");
      if (no === undefined) {
        cell.className = "seat none";
      } else if (no === null) {
        cell.className = "seat empty";
        cell.innerHTML = '<span class="no">－</span>';
      } else {
        cell.className = "seat";
        const n = document.createElement("span");
        n.className = "no";
        n.textContent = no;
        cell.appendChild(n);
      }
      grid.appendChild(cell);
    }));
    if (fromTeacher) room.append(grid, board);
    else room.append(board, grid);
    stage.replaceChildren(room);

    $("status").textContent = current ? `${formatDate(current.at)} の席替え` : "席替え前（出席番号順）";
    $("flip").textContent = fromTeacher ? "生徒から見る" : "教卓から見る";
    $("flip").setAttribute("aria-pressed", String(fromTeacher));
    $("undo").disabled = history.length === 0;
    $("open-output").disabled = !current;
  }

  function showNote(text) {
    const note = $("note");
    note.textContent = text;
    note.hidden = !text;
  }
  function showOutputNote(text) {
    const note = $("output-note");
    note.textContent = text;
    note.hidden = !text;
  }

  // 前希望を反映した設定
  const configWithFront = (frontNos) => ({ ...config, students: allNos.map((no) => ({ no, front: frontNos.includes(no) })) });

  // 新しい座席にする（戻せるように今の座席を履歴に積む）
  function applySeats(next) {
    if (current) history = history.concat([current]).slice(-20);
    current = next;
    save();
    render();
  }

  // 席替えのたびに乱数のシードを決め、あとで同じ席替えを再現できるようにする
  function doShuffle() {
    const seed = crypto.getRandomValues(new Uint32Array(1))[0];
    const frontNos = [...front].sort((a, b) => a - b);
    const seats = Seating.assignSeats(configWithFront(frontNos), Share.seededRandom(seed));
    showNote("");
    applySeats({ seats, at: new Date().toISOString(), seed, front: frontNos });
  }

  function undo() {
    if (!history.length) return;
    current = history[history.length - 1];
    history = history.slice(0, -1);
    save();
    showNote("");
    render();
  }

  function flip() {
    fromTeacher = !fromTeacher;
    storage.set(VIEW_KEY, fromTeacher ? "teacher" : "student");
    render();
  }

  // ---- 共有（シードと完全再現コード） ----
  const siteUrl = () => (location.protocol.startsWith("http") && !window.SEKIGAE_PREVIEW
    ? location.origin + location.pathname
    : config.siteUrl || location.href.split("#")[0]);
  const fullCodeOf = (seats) => Share.encodeSeats(seats, config.layout, allNos);

  function openShare() {
    $("import-error").hidden = true;
    $("share-note").textContent = "";
    $("share-send").hidden = !current;
    if (current) {
      const code = fullCodeOf(current.seats);
      $("full-code").textContent = Share.group(code, 5);
      const qr = qrcode(0, "M");
      qr.addData(`${siteUrl()}#s=${code}`);
      qr.make();
      $("share-qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
      const hasSeed = typeof current.seed === "number";
      $("seed-code").textContent = hasSeed
        ? Share.group(Share.encodeSeed(current.seed, configWithFront(current.front || []), current.front || []), 4)
        : "なし";
      $("copy-seed").hidden = !hasSeed;
      $("seed-hint").textContent = hasSeed
        ? "短いコードです。前希望などの設定がこの端末と同じ端末でだけ、同じ座席になります。"
        : "コードから再現した座席にはシードがありません。完全再現コードを使ってください。";
    }
    $("share-dialog").showModal();
  }

  function copyText(text, label) {
    const done = () => { $("share-note").textContent = `${label}をコピーしました。`; };
    const fail = () => { $("share-note").textContent = "コピーできませんでした。コードを選んでコピーしてください。"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  }

  // 入力されたコード（URL でも可）から座席を再現する。うまくいかなければ理由を返す
  function importCode(input) {
    const m = String(input).match(/[#&]s=([0-9a-fA-F\s-]+)/);
    const code = Share.clean(m ? m[1] : input);
    if (code.length === 10) {
      const frontNos = [...front].sort((a, b) => a - b);
      const r = Share.decodeSeed(code, configWithFront(frontNos), frontNos);
      if (r.error === "settings") return "シードは合っていても、この端末の前希望などの設定がコードを作った端末と違うため、同じ座席にできません。完全再現コードを使ってください。（入力ミスの場合もあります）";
      if (r.error) return "シードが読み取れませんでした。";
      const next = Seating.assignSeats(configWithFront(frontNos), Share.seededRandom(r.seed));
      applySeats({ seats: next, at: new Date().toISOString(), seed: r.seed, front: frontNos });
      return null;
    }
    if (code.length === Share.rankDigits(seats.length) + 2) {
      const r = Share.decodeSeats(code, config.layout, allNos, seats.length);
      if (r.error) return "コードが正しくありません。入力ミスがないか確かめてください。";
      applySeats({ seats: r.seats, at: new Date().toISOString() });
      return null;
    }
    return `桁数が違います（${code.length}桁）。シードは10桁、完全再現コードは${Share.rankDigits(seats.length) + 2}桁です。`;
  }

  function doImport() {
    const error = importCode($("import-code").value);
    showImportError(error);
    if (!error) {
      $("import-code").value = "";
      $("share-dialog").close();
      showNote("受け取ったコードの座席を表示しています。「1つ前に戻す」で元に戻せます。");
    }
  }

  // ---- QR コードの読み取り（カメラ・画像） ----
  let scanStream = null;
  let scanFrame = 0;

  function showImportError(text) {
    $("import-error").textContent = text || "";
    $("import-error").hidden = !text;
  }

  // 読み取った文字列を入力欄に入れて再現する
  function useScanned(text) {
    stopCamera();
    if (!/[#&]s=|^[\s0-9a-fA-F-]+$/.test(text)) {
      showImportError("座席のコードではない QR コードです。");
      return;
    }
    $("import-code").value = text;
    doImport();
  }

  // 画像（canvas に描いたもの）から QR を探す
  function scanCanvas(canvas, thorough) {
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const found = jsQR(img.data, img.width, img.height, { inversionAttempts: thorough ? "attemptBoth" : "dontInvert" });
    return found ? found.data : null;
  }

  async function startCamera() {
    showImportError("");
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showImportError("このブラウザではカメラを使えません。「画像から QR を読み取る」を使ってください。");
      return;
    }
    try {
      scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
    } catch (e) {
      showImportError(e && e.name === "NotAllowedError"
        ? "カメラの使用が許可されませんでした。ブラウザの設定でカメラを許可するか、「画像から QR を読み取る」を使ってください。"
        : "カメラを起動できませんでした。「画像から QR を読み取る」を使ってください。");
      return;
    }
    const video = $("scan-video");
    video.srcObject = scanStream;
    $("scanner").hidden = false;
    $("share-send").hidden = true; // 読み取り中は自分の QR を隠して画面に収める
    await video.play().catch(() => {});
    const canvas = document.createElement("canvas");
    const tick = () => {
      if (!scanStream) return;
      if (video.readyState >= 2 && video.videoWidth) {
        // 大きすぎる映像は縮めて読む（速さのため）
        const scale = Math.min(1, 800 / Math.max(video.videoWidth, video.videoHeight));
        canvas.width = Math.round(video.videoWidth * scale);
        canvas.height = Math.round(video.videoHeight * scale);
        canvas.getContext("2d", { willReadFrequently: true }).drawImage(video, 0, 0, canvas.width, canvas.height);
        const text = scanCanvas(canvas, false);
        if (text) { useScanned(text); return; }
      }
      scanFrame = requestAnimationFrame(tick);
    };
    scanFrame = requestAnimationFrame(tick);
  }

  function stopCamera() {
    cancelAnimationFrame(scanFrame);
    if (scanStream) scanStream.getTracks().forEach((t) => t.stop());
    scanStream = null;
    $("scan-video").srcObject = null;
    $("scanner").hidden = true;
    $("share-send").hidden = !current;
  }

  async function scanImageFile() {
    const file = $("scan-image").files[0];
    $("scan-image").value = "";
    if (!file) return;
    showImportError("");
    try {
      const bitmap = await createImageBitmap(file);
      // 大きな写真は縮めてから読む。見つからなければ元の大きさでも試す
      for (const max of [1600, Math.max(bitmap.width, bitmap.height)]) {
        const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d", { willReadFrequently: true }).drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const text = scanCanvas(canvas, true);
        if (text) { useScanned(text); return; }
      }
      showImportError("画像から QR コードが見つかりませんでした。QR コードが大きくはっきり写った画像を選んでください。");
    } catch (e) {
      showImportError("画像を読み込めませんでした。");
    }
  }

  // QR コードから開いたとき（URL の #s=...）
  function importFromUrl() {
    if (!/[#&]s=/.test(location.hash)) return;
    const error = importCode(location.hash);
    showNote(error ? `共有された座席を開けませんでした。${error}` : "共有された座席を表示しています。「1つ前に戻す」で元に戻せます。");
    try { window.history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* そのまま */ }
  }

  // ---- 前希望 ----
  function buildFrontPicker() {
    $("front-hint").textContent = `番号を押して選びます。選んだ人は前から${frontRows}列目までに入ります。`;
    $("front-picker").replaceChildren(...allNos.map((no) => {
      const label = document.createElement("label");
      const input = document.createElement("input");
      input.type = "checkbox";
      input.id = `front-${no}`;
      input.setAttribute("aria-label", `${no}番`);
      input.addEventListener("change", () => {
        if (input.checked) front.add(no); else front.delete(no);
        saveFront();
      });
      const span = document.createElement("span");
      span.textContent = no;
      label.append(input, span);
      return label;
    }));
  }
  function syncFrontPicker() {
    allNos.forEach((no) => { $(`front-${no}`).checked = front.has(no); });
    const n = front.size;
    const count = $("front-count");
    count.className = "hint" + (n > frontCapacity ? " warn" : "");
    count.textContent = n > frontCapacity
      ? `${n}人選択中。前から${frontRows}列目までは${frontCapacity}席なので、${n - frontCapacity}人は${frontRows + 1}列目以降に入ります。`
      : `${n}人選択中（前から${frontRows}列目までは${frontCapacity}席）`;
  }
  function saveFront() {
    storage.set(FRONT_KEY, [...front].sort((a, b) => a - b));
    syncFrontPicker();
  }

  // ---- 名前（暗号化された一覧） ----
  // names.js はブラウザに古いものが残りやすいので、出力画面を開くたびに最新を読み直す。
  // 読めないとき（プレビューなど）は、ページに読み込まれたものを使う。
  async function refreshNames() {
    try {
      const res = await fetch("names.js", { cache: "no-store" });
      if (!res.ok) return;
      const m = (await res.text()).match(/SEKIGAE_NAMES\s*=\s*(\{[\s\S]*\}|null)\s*;/);
      if (!m) return;
      const latest = JSON.parse(m[1]);
      if (JSON.stringify(latest) === JSON.stringify(encryptedNames)) return;
      encryptedNames = latest;
      names = null; // 一覧が作り直されたので、読み込み直す
    } catch (e) { /* そのまま */ }
  }

  function syncNames() {
    $("names-none").hidden = !!encryptedNames;
    $("names-locked").hidden = !encryptedNames || !!names;
    // どの一覧を使っているか分かるように、作成日時を出す（作成日時が入っている一覧だけ）
    const created = encryptedNames && encryptedNames.created ? new Date(encryptedNames.created) : null;
    $("names-created").hidden = !created;
    if (created) $("names-created").textContent = `登録されている一覧：${formatDate(created.toISOString())} に作成`;
    $("names-unlocked").hidden = !names;
  }

  async function tryUnlockSaved() {
    const saved = storage.get(NAMEKEY_KEY);
    if (!encryptedNames || names || !saved || saved.salt !== encryptedNames.salt) return;
    try {
      names = await Secret.unlockWithSavedKey(encryptedNames, saved.key);
    } catch (e) {
      storage.remove(NAMEKEY_KEY); // 名前の一覧が作り直されたなど
    }
    syncNames();
  }

  async function unlock() {
    const pw = $("pw").value;
    const err = $("pw-error");
    if (!pw) return;
    $("unlock").disabled = true;
    err.hidden = true;
    try {
      const result = await Secret.unlockWithPassword(encryptedNames, pw);
      names = result.names;
      if ($("remember").checked) storage.set(NAMEKEY_KEY, { salt: encryptedNames.salt, key: result.savedKey });
      $("pw").value = "";
    } catch (e) {
      err.textContent = "パスワードが違います。「パスワードを表示」で入力した内容を確かめてください。";
      err.hidden = false;
    }
    $("unlock").disabled = false;
    syncNames();
  }

  function forget() {
    storage.remove(NAMEKEY_KEY);
    names = null;
    syncNames();
  }

  // ---- 出力 ----
  function positions() {
    const pos = new Map();
    seats.forEach((seat, i) => { if (current.seats[i] !== null) pos.set(current.seats[i], seat); });
    return pos;
  }

  const sheetTitle = () => `${config.className || ""}座席表`;
  const countLabel = () => `在籍　${allNos.length}名`;
  // 「4月7日～」の形。日付が未入力なら席替えした日。「日付を入れる」を外したときは空
  function startDateLabel() {
    if (!$("with-date").checked) return "";
    const [, m, d] = ($("start-date").value || fileDate(current.at)).split("-").map(Number);
    return `${m}月${d}日～`;
  }

  // 印刷用の座席表（各席の左上に出席番号、四角の中にふりがなと名前）
  function renderSheet() {
    const el = (cls, text) => {
      const e = document.createElement("div");
      e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    };
    const head = el("sheet-head");
    head.append(el("sheet-date", startDateLabel()), fromTeacher ? el("") : el("sheet-desk", "教卓"), el("sheet-count", countLabel()));

    const grid = el("sheet-grid");
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
    toMatrix(current.seats).forEach((line) => line.forEach((no) => {
      const cell = el("sheet-cell");
      if (no !== undefined) {
        const box = el("sheet-box");
        if (no !== null) {
          const { name, kana } = entryOf(no);
          // 長い文字は小さくして四角に収める（半角は全角の約半分の幅）
          const fitted = (cls, text, size, maxUnits) => {
            const e = el(cls, text);
            const units = Array.from(text).reduce((n, ch) => n + (ch.charCodeAt(0) < 0x100 ? 0.55 : 1), 0);
            if (units > maxUnits) e.style.fontSize = `${((size * maxUnits) / units).toFixed(2)}cqw`;
            return e;
          };
          if (kana) box.appendChild(fitted("sheet-kana", kana, 1.1, 8.5));
          if (name) box.appendChild(fitted("sheet-name", name, 1.9, 5.2));
        }
        cell.append(el("sheet-no", no === null ? "" : no), box);
      }
      grid.appendChild(cell);
    }));

    const parts = [el("sheet-title", sheetTitle()), head, grid];
    if (fromTeacher) {
      const foot = el("sheet-head");
      foot.append(el(""), el("sheet-desk", "教卓"), el(""));
      parts.push(foot);
    }
    const inner = el("sheet-inner");
    inner.append(...parts);
    $("sheet").replaceChildren(inner);
  }

  // 座席表（印刷と同じ見た目・A4横）と出席番号順の一覧の2シート
  function buildWorkbook() {
    const S = Xlsx.STYLE;
    // 1つの席の列 = 出席番号の列 + 名前の四角の列。席の列の間に通路の列を挟む
    const width = cols * 3 - 1;
    const numCol = (c) => c * 3;
    const boxCol = (c) => c * 3 + 1;
    const blank = () => Array(width).fill(null);
    const fill = (row, from, to, cell) => { for (let i = from; i <= to; i++) row[i] = { ...cell, v: i === from ? cell.v : "" }; };

    const deskFrom = boxCol(Math.floor((cols - 1) / 2));
    const deskTo = boxCol(Math.ceil((cols - 1) / 2));
    const sheetRows = [];
    const heights = {};
    const merges = [];
    const mergeRow = (r, from, to) => merges.push(`${Xlsx.colName(from)}${r + 1}:${Xlsx.colName(to)}${r + 1}`);
    const push = (row, h) => { heights[sheetRows.length] = h; sheetRows.push(row); return sheetRows.length - 1; };
    const deskRow = () => {
      const row = blank();
      fill(row, deskFrom, deskTo, { v: "教　　卓", s: S.desk });
      mergeRow(push(row, 24), deskFrom, deskTo);
    };

    const titleRow = blank();
    titleRow[0] = { v: sheetTitle(), s: S.title };
    mergeRow(push(titleRow, 30), 0, width - 1);

    const headRow = blank();
    headRow[0] = { v: startDateLabel(), s: S.left };
    headRow[deskTo + 2] = { v: countLabel(), s: S.right };
    if (!fromTeacher) fill(headRow, deskFrom, deskTo, { v: "教　　卓", s: S.desk });
    const headIndex = push(headRow, 24);
    if (deskFrom > 1) mergeRow(headIndex, 0, deskFrom - 2);
    mergeRow(headIndex, deskTo + 2, width - 1);
    if (!fromTeacher) mergeRow(headIndex, deskFrom, deskTo);
    push(blank(), 8);

    const withNames = useNames();
    toMatrix(current.seats).forEach((line, r) => {
      if (r > 0) push(blank(), 6);
      const row = blank();
      line.forEach((no, c) => {
        if (no === undefined) return;
        const { name, kana } = no === null ? { name: "", kana: "" } : entryOf(no);
        row[numCol(c)] = { v: no === null ? "" : no, s: S.num };
        // ふりがなは小さい文字で名前の上の行に
        row[boxCol(c)] = { v: kana ? [{ t: `${kana}\n`, sz: 8 }, { t: name, sz: 14 }] : name, s: S.box };
      });
      push(row, withNames ? 40 : 34);
    });
    if (fromTeacher) {
      push(blank(), 8);
      deskRow();
    }

    const pos = positions();
    const listRows = [["出席番号", "名前", "ふりがな", "前から何列目", "左から何番目"].map((v) => ({ v, s: S.head }))];
    allNos.forEach((no) => {
      const seat = pos.get(no);
      const { name, kana } = entryOf(no);
      listRows.push([no, name, kana, seat ? seat.row + 1 : "", seat ? seat.col + 1 : ""].map((v) => ({ v, s: S.cell })));
    });

    return Xlsx.build([
      {
        name: "座席表",
        rows: sheetRows,
        colWidths: Array.from({ length: width }, (_, i) => [3.5, 17, 2.5][i % 3]),
        rowHeights: heights,
        merges,
        landscape: true,
      },
      { name: "一覧", rows: listRows, colWidths: [10, 20, 24, 14, 14] },
    ]);
  }

  // ファイルを保存する。アーティファクトのプレビューでは downloads を使う
  async function saveFile(filename, bytes) {
    const downloads = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
    if (downloads) {
      try {
        await downloads.save({ filename, data: bytes });
      } catch (e) {
        if (!e || e.code !== "declined") showOutputNote("この環境ではファイルを保存できませんでした。");
      }
      return;
    }
    const url = URL.createObjectURL(new Blob([bytes], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function saveXlsx() {
    saveFile(`座席表_${fileDate(current.at)}.xlsx`, buildWorkbook());
  }

  function printPdf() {
    $("output-dialog").close();
    renderSheet();
    window.print();
    if (window.SEKIGAE_PREVIEW) showNote("プレビュー環境では印刷できません。GitHub Pages 版で使えます。");
  }

  // タブ区切りでコピー。Googleスプレッドシートにそのまま貼り付けられる
  function copyTable() {
    const gridRows = toMatrix(current.seats).map((line) => line.map((no) => {
      if (no === undefined || no === null) return "";
      const name = nameOf(no);
      return name ? `${no} ${name}` : no;
    }));
    const text = (fromTeacher ? gridRows.concat([["黒板"]]) : [["黒板"]].concat(gridRows))
      .map((r) => r.join("\t")).join("\n");
    const done = () => showOutputNote("座席表をコピーしました。スプレッドシートの左上のセルに貼り付けてください。");
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      $("output-dialog").appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { showOutputNote("コピーできませんでした。"); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  const errors = Seating.validate(config);
  if (errors.length) {
    stage.innerHTML = "";
    const box = document.createElement("div");
    box.className = "error";
    box.textContent = "config.js の設定を確認してください。\n" + errors.join("\n");
    stage.appendChild(box);
    document.querySelectorAll(".actions button").forEach((b) => { b.disabled = true; });
    return;
  }

  $("shuffle").addEventListener("click", doShuffle);
  $("undo").addEventListener("click", undo);
  $("flip").addEventListener("click", flip);
  $("open-front").addEventListener("click", () => {
    syncFrontPicker();
    $("front-dialog").showModal();
  });
  $("front-clear").addEventListener("click", () => { front.clear(); saveFront(); });
  $("front-reset").addEventListener("click", () => {
    front = configFront();
    storage.remove(FRONT_KEY);
    syncFrontPicker();
  });
  $("open-output").addEventListener("click", async () => {
    showOutputNote("");
    if (!$("start-date").value) $("start-date").value = fileDate(current.at);
    $("start-date").disabled = !$("with-date").checked;
    syncNames();
    $("output-dialog").showModal();
    await refreshNames();
    syncNames();
    await tryUnlockSaved();
  });
  $("with-date").addEventListener("change", () => {
    $("start-date").disabled = !$("with-date").checked;
    storage.set(DATE_KEY, $("with-date").checked);
  });
  $("unlock").addEventListener("click", unlock);
  $("pw").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); unlock(); }
  });
  $("forget").addEventListener("click", forget);
  $("open-share").addEventListener("click", openShare);
  $("copy-full").addEventListener("click", () => copyText(Share.clean($("full-code").textContent), "完全再現コード"));
  $("copy-seed").addEventListener("click", () => copyText(Share.clean($("seed-code").textContent), "シード"));
  $("import").addEventListener("click", doImport);
  $("scan-camera").addEventListener("click", startCamera);
  $("scan-stop").addEventListener("click", stopCamera);
  $("scan-image").addEventListener("change", scanImageFile);
  $("share-dialog").addEventListener("close", stopCamera);
  $("import-code").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); doImport(); }
  });
  $("show-pw").addEventListener("change", () => { $("pw").type = $("show-pw").checked ? "text" : "password"; });
  $("pdf").addEventListener("click", printPdf);
  $("xlsx").addEventListener("click", saveXlsx);
  $("copy").addEventListener("click", copyTable);
  // ブラウザのメニューから印刷したときも座席表を出し、終わったら名前ごと消す
  window.addEventListener("beforeprint", () => { if (current) renderSheet(); });
  window.addEventListener("afterprint", () => $("sheet").replaceChildren());

  load();
  importFromUrl();
  $("with-date").checked = storage.get(DATE_KEY) !== false;
  buildFrontPicker();
  render();
})();
</script>
<!-- artifact:body:end -->
</body>
