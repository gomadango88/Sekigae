<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- artifact:head:start -->
<title>席替えシステム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  /* 教室を上から見た図：上端に黒板、その下に座席グリッドを一画面に収める */
  :root {
    --bg: #eef2f0;
    --surface: #ffffff;
    --ink: #1c2925;
    --muted: #5e6f69;
    --line: #c9d4cf;
    --board: #2e5a4c;
    --board-ink: #f2f5ef;
    --accent: #2e5a4c;
    --accent-ink: #ffffff;
    --font: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #111715; --surface: #1a2320; --ink: #e6eeea; --muted: #94a6a0; --line: #33433d;
      --board: #24463b; --board-ink: #e8efe6; --accent: #8cc4ae; --accent-ink: #0f1a16;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #111715; --surface: #1a2320; --ink: #e6eeea; --muted: #94a6a0; --line: #33433d;
    --board: #24463b; --board-ink: #e8efe6; --accent: #8cc4ae; --accent-ink: #0f1a16;
    color-scheme: dark;
  }

  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
  }
  .app {
    height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-inline: 16px;
    padding-block: 10px 14px;
  }

  .bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
  }
  .bar h1 { margin: 0; font-size: 1.25rem; font-weight: 700; }
  .status { color: var(--muted); font-size: 0.9rem; font-variant-numeric: tabular-nums; flex: 1; min-width: 0; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    font: inherit;
    font-size: 0.9rem;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    padding-inline: 20px;
  }
  .note { color: var(--muted); font-size: 0.8rem; }

  /* 座席エリア。高さいっぱいに広げ、横幅は高さに合わせて上限をかける */
  .stage {
    flex: 1;
    min-height: 0;
    container-type: size;
    display: grid;
    place-items: center;
  }
  .room {
    width: min(100cqw, 125cqh);
    height: 100cqh;
    display: flex;
    flex-direction: column;
    gap: 1.2cqh;
  }
  .board {
    background: var(--board);
    color: var(--board-ink);
    text-align: center;
    border-radius: 4px;
    font-size: clamp(0.75rem, 2.6cqh, 1.4rem);
    padding-block: 0.6cqh;
    letter-spacing: 0.4em;
  }
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    gap: 0.8cqh;
  }
  .seat {
    container-type: size;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    overflow: hidden;
  }
  .seat.none { background: transparent; border-color: transparent; }
  .seat .no {
    font-weight: 700;
    font-size: min(58cqh, 40cqw);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .seat.has-name .no { font-size: min(40cqh, 30cqw); }
  .seat .name {
    font-size: min(24cqh, 15cqw);
    line-height: 1.2;
    margin-top: 4cqh;
    max-width: 94%;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .seat.empty .no { color: var(--muted); font-weight: 400; }
  .before .seat .no { color: var(--muted); }

  .error {
    border: 1px solid #b4483c;
    color: #b4483c;
    background: var(--surface);
    padding: 12px 16px;
    border-radius: 6px;
    white-space: pre-line;
  }

  .print-only { display: none; }

  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    :root { color-scheme: light; }
    html, body { height: auto; background: #fff; color: #000; }
    .app { height: auto; padding: 0; gap: 4mm; }
    .bar, .note { display: none; }
    .print-only { display: block; }
    .print-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 14pt; }
    .print-head span { font-size: 10pt; }
    .stage { container-type: normal; display: block; }
    .room { width: 100%; height: 255mm; gap: 3mm; }
    .board { background: #fff; color: #000; border: 1px solid #000; font-size: 11pt; padding-block: 1.5mm; }
    .grid { gap: 1.5mm; }
    .seat { border-color: #000; background: #fff; color: #000; }
    .seat.none { border-color: transparent; }
    .seat .no, .seat.has-name .no { font-size: 20pt; color: #000; }
    .seat .name { font-size: 11pt; margin-top: 1.5mm; }
  }
</style>
<!-- artifact:head:end -->
</head>
<body>
<!-- artifact:body:start -->
<div class="app">
  <header class="bar">
    <h1>席替え</h1>
    <div class="status" id="status"></div>
    <div class="actions">
      <button type="button" class="primary" id="shuffle">席替えする</button>
      <button type="button" id="undo" disabled>1つ前に戻す</button>
      <button type="button" id="pdf">PDF・印刷</button>
      <button type="button" id="csv">CSVで保存</button>
      <button type="button" id="copy">表をコピー</button>
    </div>
  </header>
  <div class="note" id="note" hidden></div>
  <div class="print-only print-head"><strong>座席表</strong><span id="print-date"></span></div>
  <main class="stage" id="stage"></main>
</div>
<!-- artifact:scripts:start -->
<script src="config.js"></script>
<script src="seating.js"></script>
<!-- artifact:scripts:end -->
<script>
(function () {
  "use strict";
  const config = window.SEKIGAE_CONFIG;
  const { seats, rows, cols } = Seating.parseLayout(config.layout);
  const studentsByNo = new Map(config.students.map((s) => [s.no, s]));
  const STORAGE_KEY = "sekigae:v1";
  const signature = JSON.stringify([config.layout, config.frontRows, config.students.map((s) => [s.no, !!s.front])]);

  const $ = (id) => document.getElementById(id);
  const stage = $("stage");

  // 現在の配置と、戻すための履歴
  let current = null; // { seats: [番号|null...], at: ISO文字列 }
  let history = [];

  function load() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (saved && saved.signature === signature) {
        current = saved.current;
        history = saved.history || [];
      }
    } catch (e) { /* 保存できない環境ではそのまま */ }
  }
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ signature, current, history }));
    } catch (e) { /* 保存できない環境ではそのまま */ }
  }

  function formatDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日 ${d.getHours()}:${String(d.getMinutes()).padStart(2, "0")}`;
  }
  function fileDate(iso) {
    const d = new Date(iso);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  }

  // 席替え前は出席番号順に並べて表示する
  function orderedSeats() {
    const nos = config.students.map((s) => s.no).sort((a, b) => a - b);
    return seats.map((_, i) => (i < nos.length ? nos[i] : null));
  }

  // 行（前から）× 列（左から）のマス目。座席でないマスは undefined
  function toMatrix(assignment) {
    const m = Array.from({ length: rows }, () => Array(cols).fill(undefined));
    seats.forEach((seat, i) => { m[seat.row][seat.col] = assignment[i]; });
    return m;
  }

  function label(no) {
    if (no === null) return "";
    const name = (studentsByNo.get(no) || {}).name || "";
    return name ? `${no} ${name}` : String(no);
  }

  function render() {
    const assignment = current ? current.seats : orderedSeats();
    const matrix = toMatrix(assignment);

    const room = document.createElement("div");
    room.className = "room" + (current ? "" : " before");
    const board = document.createElement("div");
    board.className = "board";
    board.textContent = "黒板";
    room.appendChild(board);

    const grid = document.createElement("div");
    grid.className = "grid";
    grid.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
    grid.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
    matrix.forEach((line) => line.forEach((no) => {
      const cell = document.createElement("div");
      if (no === undefined) {
        cell.className = "seat none";
      } else if (no === null) {
        cell.className = "seat empty";
        cell.innerHTML = '<span class="no">－</span>';
      } else {
        const name = (studentsByNo.get(no) || {}).name || "";
        cell.className = "seat" + (name ? " has-name" : "");
        const n = document.createElement("span");
        n.className = "no";
        n.textContent = no;
        cell.appendChild(n);
        if (name) {
          const nm = document.createElement("span");
          nm.className = "name";
          nm.textContent = name;
          cell.appendChild(nm);
        }
      }
      grid.appendChild(cell);
    }));
    room.appendChild(grid);
    stage.replaceChildren(room);

    const frontCount = config.students.filter((s) => s.front).length;
    $("status").textContent =
      (current ? `${formatDate(current.at)} の席替え` : "席替え前（出席番号順）") +
      `　${config.students.length}人・前希望${frontCount}人`;
    $("print-date").textContent = current ? formatDate(current.at) : "";
    $("undo").disabled = history.length === 0;
    ["pdf", "csv", "copy"].forEach((id) => { $(id).disabled = !current; });
  }

  function showNote(text) {
    const note = $("note");
    note.textContent = text;
    note.hidden = !text;
  }

  function doShuffle() {
    if (current) history = history.concat([current]).slice(-20);
    current = { seats: Seating.assignSeats(config), at: new Date().toISOString() };
    save();
    showNote("");
    render();
  }

  function undo() {
    if (!history.length) return;
    current = history[history.length - 1];
    history = history.slice(0, -1);
    save();
    showNote("");
    render();
  }

  // 書き出し用の表（1行目が黒板側）
  function gridRows() {
    return toMatrix(current.seats).map((line) => line.map((no) => (no === undefined ? "" : label(no))));
  }

  function csvCell(v) {
    v = String(v);
    return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  }

  function downloadCsv() {
    const lines = [];
    lines.push(["座席表", formatDate(current.at)]);
    lines.push(["（黒板）"]);
    gridRows().forEach((r) => lines.push(r));
    lines.push([]);
    lines.push(["出席番号", "名前", "前から何列目", "左から何番目"]);
    const pos = new Map();
    seats.forEach((seat, i) => { if (current.seats[i] !== null) pos.set(current.seats[i], seat); });
    config.students.slice().sort((a, b) => a.no - b.no).forEach((s) => {
      const seat = pos.get(s.no);
      lines.push([s.no, s.name || "", seat ? seat.row + 1 : "", seat ? seat.col + 1 : ""]);
    });
    const text = "﻿" + lines.map((r) => r.map(csvCell).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob([text], { type: "text/csv" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `座席表_${fileDate(current.at)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    if (window.SEKIGAE_PREVIEW) showNote("プレビュー環境ではファイルを保存できません。GitHub Pages 版で使えます。");
  }

  function printPdf() {
    window.print();
    if (window.SEKIGAE_PREVIEW) showNote("プレビュー環境では印刷できません。GitHub Pages 版で使えます。");
  }

  // タブ区切りでコピー。Googleスプレッドシートにそのまま貼り付けられる
  function copyTable() {
    const text = [["黒板"]].concat(gridRows()).map((r) => r.join("\t")).join("\n");
    const done = () => showNote("座席表をコピーしました。スプレッドシートの左上のセルに貼り付けてください。");
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) { showNote("コピーできませんでした。"); }
      ta.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  const errors = Seating.validate(config);
  if (errors.length) {
    stage.innerHTML = "";
    const box = document.createElement("div");
    box.className = "error";
    box.textContent = "config.js の設定を確認してください。\n" + errors.join("\n");
    stage.appendChild(box);
    document.querySelectorAll(".actions button").forEach((b) => { b.disabled = true; });
    return;
  }

  $("shuffle").addEventListener("click", doShuffle);
  $("undo").addEventListener("click", undo);
  $("pdf").addEventListener("click", printPdf);
  $("csv").addEventListener("click", downloadCsv);
  $("copy").addEventListener("click", copyTable);

  load();
  render();
})();
</script>
<!-- artifact:body:end -->
</body>
</html>
